# Publica el boceto en GitHub Pages cada vez que se sube algo a main.
# El boceto es el sitio en "modo prueba": trae una base de mentira adentro del
# navegador (con stock inventado), asi que no necesita Supabase y no toca
# datos reales. Todo vuelve a cero al recargar la pagina.
# El sitio real (con Supabase) se publica en Vercel; ver DESPLIEGUE.md.
name: Boceto en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar
        run: npm ci
        working-directory: web
      - name: Probar
        run: npm run probar && npm run probar-base
        working-directory: web
      - name: Compilar el boceto
        run: npm run build:demo
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4
